<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48">
<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml">
<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest">
<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EDF2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1A23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
/* Design und Animationen vor dem ersten Zeichnen setzen (kein Aufblitzen im falschen Design) */
try{var p=JSON.parse(localStorage.getItem('freiheit-prefs')||'{}'),r=document.documentElement;
if(p.theme==='light'||p.theme==='dark')r.setAttribute('data-theme',p.theme);
if(p.motion==='off'||(p.motion!=='on'&&matchMedia('(prefers-reduced-motion: reduce)').matches))r.setAttribute('data-motion','reduce')}catch(e){}
/* Kein Seiten-Zoom per Zwei-Finger-Geste (iOS beachtet user-scalable=no nicht); Karte zoomt selbst */
document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
</script>

<meta name="apple-mobile-web-app-title" content="Freiheit">
<title>Freiheit by Maier Reisen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
