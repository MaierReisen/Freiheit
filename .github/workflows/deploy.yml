name: Build und Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # täglich neu bauen: Reisewarnungen und Einreiseregeln des Auswärtigen Amts bleiben aktuell
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Hängende Läufe (z. B. bei GitHub-Störungen) brechen ab, statt stundenlang zu blockieren
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Einreise-Daten frisch vom Auswärtigen Amt; schlägt der Abruf fehl, bleibt der gespeicherte Stand
      - name: Einreise-Daten aktualisieren
        run: python3 scripts/build-entry.py
        continue-on-error: true

      - run: npm run check

      - name: Build
        run: npm run build
        env:
          # Projektseite: https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Normal dauert die Veröffentlichung 10 s bis 2 min. Bei GitHub-Störungen hängt sie manchmal länger; nach Ablauf
          # bricht GitHub sie ab, und ein Neustart desselben Laufs scheitert dann sofort („Deployment cancelled“) –
          # deshalb großzügig warten. Hilft das nicht: Workflow von Hand neu starten (gh workflow run deploy.yml).
          timeout: 900000
